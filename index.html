<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .profile-img-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
        }

        /* تم حذف تنسيقات زر/أيقونة التعديل نهائياً */

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .social-btn {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .social-btn:hover {
            opacity: 0.85;
        }

        .tiktok { background-color: #000000; border: 1px solid #333; }
        .instagram { background-color: #E1306C; }
        .snapchat { background-color: #FFFC00; color: #000; }
        .discord { background-color: #5865F2; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-img-container">
            <!-- استبدل image.jpg برابط صورتك الشخصية -->
            <img src="image.jpg" alt="Profile Picture" class="profile-img">
        </div>

        <div class="social-links">
            <a href="https://www.tiktok.com/@l_3ey" target="_blank" class="social-btn tiktok">TikTok</a>
            <a href="https://www.instagram.com/33dzl" target="_blank" class="social-btn instagram">Instagram</a>
            <a href="https://www.snapchat.com/add/l_3ej" target="_blank" class="social-btn snapchat">Snapchat</a>
            <a href="https://discord.com/users/8ojx" target="_blank" class="social-btn discord">Discord (8ojx)</a>
        </div>
    </div>

</body>
</html>
