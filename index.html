<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8ojx | Bio Link</title>
  <style>
    :root {
      --bg-overlay: rgba(10, 10, 12, 0.85);
      --card-bg: rgba(22, 22, 28, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --accent-color: #5865F2; /* Discord Accent */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #0a0a0c url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000') center/cover no-repeat fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
      direction: ltr;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-overlay);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid var(--border-color);
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
    }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .icon-btn { 
      background: rgba(255,255,255,0.08); 
      border: 1px solid var(--border-color); 
      color: #fff; width: 38px; height: 38px; 
      border-radius: 50%; display: flex; 
      align-items: center; justify-content: center; 
      cursor: pointer; transition: 0.3s; 
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

    /* Profile Header */
    .profile-header { text-align: center; margin-bottom: 20px; }
    .avatar-wrapper { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); box-shadow: 0 0 20px rgba(88,101,242,0.4); }
    .display-name { font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .verified-icon { color: var(--accent-color); font-size: 1.1rem; }
    .handle { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 12px; }
    .bio-text { font-size: 0.88rem; color: #d1d1d6; line-height: 1.4; margin-bottom: 8px; padding: 0 10px; }
    .quote-text { font-size: 0.82rem; font-style: italic; color: var(--text-sub); }

    /* Social Icons */
    .social-links { display: flex; justify-content: center; gap: 14px; margin: 20px 0; }
    .social-icon { 
      background: rgba(255,255,255,0.06); 
      border: 1px solid var(--border-color); 
      border-radius: 50%; width: 42px; height: 42px; 
      display: flex; align-items: center; justify-content: center; 
      color: #fff; text-decoration: none; font-size: 1.1rem; transition: 0.2s; 
    }
    .social-icon:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

    /* Discord Card */
    .discord-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px; margin-bottom: 20px; }
    .discord-user { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .discord-avatar { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
    .discord-info .d-name { font-weight: 600; font-size: 1rem; }
    .discord-info .d-status { font-size: 0.78rem; color: var(--text-sub); }
    .badges { display: flex; gap: 6px; margin-top: 6px; }
    .badge { background: rgba(88,101,242,0.2); color: #8ea1e1; font-size: 0.65rem; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid rgba(88,101,242,0.3); }
    .discord-btn { 
      display: flex; justify-content: space-between; align-items: center; 
      background: rgba(255,255,255,0.05); padding: 10px 14px; 
      border-radius: 12px; border: 1px solid var(--border-color); 
      color: #fff; text-decoration: none; font-size: 0.85rem; transition: 0.2s; 
    }
    .discord-btn:hover { background: rgba(255,255,255,0.12); }

    /* Widgets Bar */
    .stats-row { 
      display: flex; justify-content: space-between; align-items: center; 
      font-size: 0.78rem; color: var(--text-sub); 
      background: rgba(0,0,0,0.35); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); 
    }
    .like-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; user-select: none; }
    .like-btn:active { transform: scale(1.2); }

    /* Control Panel Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; padding: 20px; overflow-y: auto; direction: rtl; }
    .modal-content { background: #16161c; border-radius: 20px; padding: 22px; max-width: 380px; margin: 30px auto; border: 1px solid var(--border-color); }
    .modal-content h3 { margin-bottom: 15px; font-size: 1.1rem; color: #fff; text-align: center; }
    .modal-content label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-top: 12px; text-align: right; }
    .modal-content input, .modal-content textarea { 
      width: 100%; background: #202028; border: 1px solid var(--border-color); 
      color: #fff; padding: 10px; border-radius: 10px; margin-top: 5px; font-size: 0.85rem; direction: ltr; 
    }
    .save-btn { width: 100%; background: var(--accent-color); color: #fff; font-weight: bold; border: none; padding: 12px; border-radius: 10px; margin-top: 18px; cursor: pointer; font-size: 0.95rem; }
    .close-btn { width: 100%; background: transparent; color: var(--text-sub); border: none; padding: 8px; margin-top: 5px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Action Bar -->
    <div class="top-bar">
      <div class="icon-btn">⚡</div>
      <!-- زر التعديل السريع -->
      <div class="icon-btn" onclick="toggleModal(true)" title="تعديل البروفايل">⚙️</div>
    </div>

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=500" id="avatarImg" class="avatar" alt="Avatar">
      </div>
      <div class="display-name" id="displayName">8ojx <span class="verified-icon">☑</span></div>
      <div class="handle" id="handleText">@8ojx</div>
      <div class="bio-text" id="bioText">Dark aesthetic creator. Building digital spaces & visual experiences.</div>
      <div class="quote-text" id="quoteText">"Welcome to my quiet space."</div>
    </div>

    <!-- Social Links -->
    <div class="social-links">
      <a href="https://tiktok.com" id="tiktokLink" target="_blank" class="social-icon">🎵</a>
      <a href="https://instagram.com" id="instaLink" target="_blank" class="social-icon">📸</a>
      <a href="https://x.com" id="xLink" target="_blank" class="social-icon">𝕏</a>
    </div>

    <!-- Discord Card -->
    <div class="discord-card">
      <div class="discord-user">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=500" id="discordAvatarImg" class="discord-avatar" alt="Discord">
        <div class="discord-info">
          <div class="d-name" id="discordName">8ojx ☑</div>
          <div class="d-status" id="discordStatus">Active online</div>
          <div class="badges">
            <span class="badge">VERIFIED</span>
            <span class="badge">CREATOR</span>
          </div>
        </div>
      </div>
      <a href="https://discord.com" id="discordBtnLink" target="_blank" class="discord-btn">
        <span>Open Discord</span>
        <span>›</span>
      </a>
    </div>

    <!-- Stats Footer -->
    <div class="stats-row">
      <span>👁 84</span>
      <span>📍 Saudi Arabia</span>
      <span id="liveClock">00:00:00 UTC+3</span>
      <div class="like-btn" onclick="addLike()">
        ❤️ <span id="likeCount">118</span>
      </div>
    </div>
  </div>

  <!-- Control Panel Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ لوحة التعديل السريعة</h3>
      
      <label>الاسم الظاهر (Display Name)</label>
      <input type="text" id="editName" value="8ojx">

      <label>يوزر الحساب (Handle)</label>
      <input type="text" id="editHandle" value="@8ojx">

      <label>الوصف (Bio)</label>
      <textarea id="editBio" rows="3"></textarea>

      <label>الاقتباس (Quote)</label>
      <input type="text" id="editQuote">

      <label>رابط الصورة الشخصية (Image URL)</label>
      <input type="text" id="editAvatar" placeholder="https://...">

      <label>رابط خلفية الموقع (Background URL)</label>
      <input type="text" id="editBg" placeholder="https://...">

      <button class="save-btn" onclick="saveData()">حفظ التعديلات</button>
      <button class="close-btn" onclick="toggleModal(false)">إلغاء</button>
    </div>
  </div>

  <script>
    function toggleModal(show) {
      document.getElementById('settingsModal').style.display = show ? 'block' : 'none';
    }

    // UTC+3 Live Clock
    function updateClock() {
      const now = new Date();
      const utc3 = new Date(now.getTime() + (3 * 60 + now.getTimezoneOffset()) * 60000);
      document.getElementById('liveClock').innerText = utc3.toTimeString().split(' ')[0] + ' UTC+3';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Likes counter starting at 118
    let likes = 118;
    function addLike() {
      likes++;
      document.getElementById('likeCount').innerText = likes;
    }

    // Save Data
    function saveData() {
      const data = {
        name: document.getElementById('editName').value,
        handle: document.getElementById('editHandle').value,
        bio: document.getElementById('editBio').value,
        quote: document.getElementById('editQuote').value,
        avatar: document.getElementById('editAvatar').value,
        bg: document.getElementById('editBg').value,
      };

      localStorage.setItem('masterBioData_8ojx', JSON.stringify(data));
      applyData(data);
      toggleModal(false);
    }

    function applyData(data) {
      if (data.name) document.getElementById('displayName').innerHTML = data.name + ' <span class="verified-icon">☑</span>';
      if (data.handle) {
        document.getElementById('handleText').innerText = data.handle;
        document.getElementById('discordName').innerText = data.handle.replace('@','') + ' ☑';
      }
      if (data.bio) document.getElementById('bioText').innerText = data.bio;
      if (data.quote) document.getElementById('quoteText').innerText = data.quote;
      if (data.avatar) {
        document.getElementById('avatarImg').src = data.avatar;
        document.getElementById('discordAvatarImg').src = data.avatar;
      }
      if (data.bg) {
        document.body.style.backgroundImage = `url('${data.bg}')`;
      }
    }

    window.onload = () => {
      const saved = localStorage.getItem('masterBioData_8ojx');
      if (saved) {
        const parsed = JSON.parse(saved);
        applyData(parsed);
        document.getElementById('editName').value = parsed.name || '8ojx';
        document.getElementById('editHandle').value = parsed.handle || '@8ojx';
        document.getElementById('editBio').value = parsed.bio || '';
        document.getElementById('editQuote').value = parsed.quote || '';
        document.getElementById('editAvatar').value = parsed.avatar || '';
        document.getElementById('editBg').value = parsed.bg || '';
      }
    };
  </script>
</body>
</html>
